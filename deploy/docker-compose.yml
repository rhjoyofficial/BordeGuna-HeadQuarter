# BordeGuna-HeadQuarter production stack for srv1808022 (ADR-012: current VPS first).
#
# Run from the repository root on the VPS:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Rules copied from the ERP stack that already runs on this host:
# - Traefik runs on the HOST network and reaches `web` by bridge IP; this stack needs no shared network.
# - Only `web` carries Traefik labels. db, redis, horizon, scheduler and backup are unreachable from outside.
# - Every service has a memory limit so the kernel kills a bounded container, never the ERP's MySQL.
# - deploy/.env is 600, owned by root, never in git (see deploy/.env.example).

name: bordeguna-hq

x-app: &app
  image: bordeguna-hq:latest
  restart: unless-stopped
  env_file: [.env]
  volumes:
    - storage:/var/www/html/storage
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - storage:/var/www/html/storage
      - public:/var/www/html/public-volume
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    networks: [internal]
    depends_on: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    labels:
      - traefik.enable=true
      - traefik.http.routers.hq.entrypoints=websecure
      - traefik.http.routers.hq.rule=Host(`hq.bordeguna.com`)
      - traefik.http.routers.hq.tls.certresolver=letsencrypt
      - traefik.http.services.hq.loadbalancer.server.port=80
      # Explicit HTTP -> HTTPS redirect so the behaviour does not depend on Traefik's global config.
      - traefik.http.routers.hq-http.entrypoints=web
      - traefik.http.routers.hq-http.rule=Host(`hq.bordeguna.com`)
      - traefik.http.routers.hq-http.middlewares=hq-redirect
      - traefik.http.middlewares.hq-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.hq-redirect.redirectscheme.permanent=true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  scheduler:
    <<: *app
    # The tick. Separate from horizon so a stuck worker can never stop scheduling.
    command: ["php", "artisan", "schedule:work"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=60
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=2000
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 320M }

  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    image: bordeguna-hq-backup:latest
    restart: unless-stopped
    env_file: [.env]
    volumes:
      # Host directory, separate from the dbdata volume (same disk: local only, not disaster-proof, docs/28).
      - /root/backups/bordeguna-hq:/backups
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - kumadata:/app/data
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }

networks:
  internal:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  storage:
  public:
  kumadata:
