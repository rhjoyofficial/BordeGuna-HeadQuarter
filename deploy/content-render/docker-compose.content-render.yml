# The Bangla card render service, on its own. ⛔ NOT part of deploy/docker-compose.yml, so no release
# builds or starts it. Started only at gate P6-G2 by a person, on the HQ network, with no public port:
#
#   docker compose -f deploy/content-render/docker-compose.content-render.yml up -d --build
#
# and then HQ_CONTENT_RENDER_URL=http://content-render:8080 in deploy/.env (a separate, reviewed step).
services:
  content-render:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    networks:
      - hq
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hq:
    external: true
    name: bordeguna-hq_default
