; HQ runtime overrides. Memory is bounded by the container limit; keep PHP well inside it.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Never print errors into responses; they go to stderr (docker logs) as JSON via Laravel.
display_errors = Off
log_errors = On
